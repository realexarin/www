<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Computer</title>

<link rel="icon" href="https://win98icons.alexmeub.com/icons/png/computer_explorer-0.png">
<link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="bgmusic" loop>
<source src="assets/song.mp3">
</audio>

<audio id="corruptMusic" loop>
<source src="assets/song2.mp3">
</audio>

<audio id="errorSound">
<source src="https://files.catbox.moe/j6n0m5.mp3">
</audio>

<div class="scanlines"></div>
<div class="noise"></div>
<div class="vignette"></div>

<div class="desktop">

<div class="icon" id="mycomputer" style="top:40px;left:30px;">
<img src="https://win98icons.alexmeub.com/icons/png/computer_explorer-0.png">
<span>My Computer</span>
</div>

<div class="icon" id="recycle" style="top:130px;left:30px;">
<img src="https://win98icons.alexmeub.com/icons/png/recycle_bin_empty-0.png">
<span>Recycle Bin</span>
</div>

<div class="icon danger" id="sys666" style="top:220px;left:30px;">
<img src="https://win98icons.alexmeub.com/icons/png/msg_error-0.png">
<span>666.sys</span>
</div>

<!-- WINDOW -->
<div class="window hidden" id="window">

<div class="titlebar">
<div class="title">My Computer</div>

<div class="controls">
<div class="btn">_</div>
<div class="btn">□</div>
<div class="btn close" id="close"></div>
</div>

</div>

<div class="content">

<div class="folder">Documents</div>
<div class="folder">Disk (C:)</div>
<div class="folder">Internet</div>

<div class="folder danger" id="file666">666.sys</div>

</div>
</div>

</div>

<!-- TASKBAR -->
<div class="taskbar">

<div class="start">
<img src="https://win98icons.alexmeub.com/icons/png/windows-0.png">
Start
</div>

<div class="clock" id="clock">03:33 AM</div>

</div>

<!-- RSOD -->
<div id="rsod" class="hidden">
<img src="assets/rsod.jpg">
</div>

<script>
const music = document.getElementById("bgmusic");
const corruptMusic = document.getElementById("corruptMusic");
const errorSound = document.getElementById("errorSound");

const win = document.getElementById("window");
const close = document.getElementById("close");

const mycomputer = document.getElementById("mycomputer");
const file666 = document.getElementById("file666");
const sys666 = document.getElementById("sys666");

const clock = document.getElementById("clock");
const rsod = document.getElementById("rsod");

let corrupted = false;

window.addEventListener("click", () => {
music.play();
}, { once:true });

mycomputer.onclick = () => {
win.classList.remove("hidden");
};

close.onclick = () => {
win.classList.add("hidden");
};

function triggerCorruption(){

if(corrupted) return;
corrupted = true;

music.pause();
corruptMusic.play();

clock.innerText = "06:66 AM";

for(let i=0;i<18;i++){

setTimeout(() => {

const p = document.createElement("div");

p.className = "popup";

p.style.left = Math.random()*window.innerWidth + "px";
p.style.top = Math.random()*window.innerHeight + "px";

p.innerText = "SYSTEM ERROR: ENTITY DETECTED";

document.body.appendChild(p);

errorSound.currentTime = 0;
errorSound.play();

}, i*180);

}

setTimeout(() => {
rsod.classList.remove("hidden");
}, 2600);

}

file666.onclick = triggerCorruption;
sys666.onclick = triggerCorruption;

</script>

</body>
</html>
