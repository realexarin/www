<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY COMPUTER</title>

<link rel="icon" type="image/png" href="https://win98icons.alexmeub.com/icons/png/computer_explorer-0.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="bgmusic" loop preload="auto">
<source src="assets/song.mp3" type="audio/mpeg">
</audio>

<audio id="errorSound">
<source src="https://files.catbox.moe/j6n0m5.mp3" type="audio/mpeg">
</audio>

<div class="scanlines"></div>
<div class="noise"></div>
<div class="vignette"></div>
<div class="flicker"></div>

<div class="desktop">

<div class="icon" id="mycomputer" style="top:40px; left:30px;">
<img src="https://win98icons.alexmeub.com/icons/png/computer_explorer-0.png">
<span>My Computer</span>
</div>

<div class="icon" style="top:130px; left:30px;">
<img src="https://win98icons.alexmeub.com/icons/png/recycle_bin_empty-0.png">
<span>Recycle Bin</span>
</div>

<div class="icon" id="danger" style="top:220px; left:30px;">
<img src="https://win98icons.alexmeub.com/icons/png/msg_warning-0.png">
<span>666</span>
</div>

<div class="window hidden" id="computerWindow">

<div class="title-bar">
<span>My Computer</span>

<div class="title-buttons">
<div></div>
<div></div>
<div class="closeBtn"></div>
</div>
</div>

<div class="window-content folders">

<div class="folder">
<img src="https://win98icons.alexmeub.com/icons/png/directory_open_file_mydocs-0.png">
<span>Documents</span>
</div>

<div class="folder">
<img src="https://win98icons.alexmeub.com/icons/png/cd_drive-0.png">
<span>Disc Drive</span>
</div>

<div class="folder">
<img src="https://win98icons.alexmeub.com/icons/png/world-0.png">
<span>Internet</span>
</div>

<div class="folder blood" id="bloodFile">
<img src="https://win98icons.alexmeub.com/icons/png/msg_error-0.png">
<span>666</span>
</div>

</div>
</div>

</div>

<div class="taskbar">

<div class="start-button">
<img src="https://win98icons.alexmeub.com/icons/png/windows-0.png">
Start
</div>

<div class="tray" id="clock">
03:33 AM
</div>

</div>

<div id="bsod">

<div class="bsod-text">
DONT COME BACK
</div>

</div>

<script>
const music = document.getElementById("bgmusic");
music.volume = 0.4;

window.addEventListener("click", () => {
music.play().catch(() => {});
}, { once:true });

const mycomputer = document.getElementById("mycomputer");
const computerWindow = document.getElementById("computerWindow");

mycomputer.onclick = () => {
computerWindow.classList.remove("hidden");
};

document.querySelector(".closeBtn").onclick = () => {
computerWindow.classList.add("hidden");
};

const bloodFile = document.getElementById("bloodFile");
const clock = document.getElementById("clock");
const bsod = document.getElementById("bsod");
const errorSound = document.getElementById("errorSound");

bloodFile.onclick = () => {

clock.innerText = "06:66 AM";

document.body.classList.add("corrupted");

for(let i = 0; i < 14; i++) {

setTimeout(() => {

const popup = document.createElement("div");

popup.className = "error-popup";

popup.style.left = Math.random() * window.innerWidth + "px";
popup.style.top = Math.random() * window.innerHeight + "px";

popup.innerHTML = `
<div class="title-bar error">
<span>FATAL ERROR</span>

<div class="title-buttons">
<div></div>
<div></div>
<div></div>
</div>
</div>

<div class="window-content">
<p>${[
"HE IS WATCHING",
"YOU SHOULD NOT HAVE OPENED IT",
"NO ESCAPE",
"WHERE IS YOUR FACE",
"THEY ARE INSIDE",
"DO NOT LOOK BEHIND YOU",
"YOU ARE STILL HERE",
"WAKE UP",
"STOP BREATHING"
][Math.floor(Math.random()*9)]}</p>
</div>
`;

document.body.appendChild(popup);

errorSound.currentTime = 0;
errorSound.play();

}, i * 250);

}

setTimeout(() => {
bsod.style.display = "flex";
}, 4500);

};

setInterval(() => {

document.querySelectorAll(".icon").forEach(icon => {

icon.style.transform =
`translate(${Math.random()*2}px, ${Math.random()*2}px)`;

});

}, 120);

</script>

</body>
</html>
