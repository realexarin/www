<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Computer</title>

<link rel="icon" href="https://win98icons.alexmeub.com/icons/png/computer_explorer-0.png">
<link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="bgmusic" loop>
<source src="assets/song.mp3">
</audio>

<audio id="corruptMusic" loop>
<source src="assets/song2.mp3">
</audio>

<audio id="errorSound">
<source src="https://files.catbox.moe/j6n0m5.mp3">
</audio>

<div class="scanlines"></div>
<div class="noise"></div>
<div class="vignette"></div>

<div class="desktop">

<!-- ICONS -->
<div class="icon" id="mycomputer" style="top:40px;left:30px;">
<img src="https://win98icons.alexmeub.com/icons/png/computer_explorer-0.png">
<span>My Computer</span>
</div>

<div class="icon" id="recycle" style="top:130px;left:30px;">
<img src="https://win98icons.alexmeub.com/icons/png/recycle_bin_empty-0.png">
<span>Recycle Bin</span>
</div>

<div class="icon danger" id="sys666" style="top:220px;left:30px;">
<img src="https://win98icons.alexmeub.com/icons/png/msg_error-0.png">
<span>666.sys</span>
</div>

<div class="icon" id="info" style="top:310px;left:30px;">
<img src="https://win98icons.alexmeub.com/icons/png/msg_information-0.png">
<span></span>
</div>

<div class="icon" id="socials" style="top:400px;left:30px;">
<img src="https://win98icons.alexmeub.com/icons/png/world-0.png">
<span></span>
</div>

<!-- MAIN WINDOW -->
<div class="window hidden" id="window">
<div class="titlebar">
<div class="title">My Computer</div>
<div class="controls"><div class="btn close" id="close"></div></div>
</div>
<div class="content">
<div class="folder">Documents</div>
<div class="folder">Disk (C:)</div>
<div class="folder">Internet</div>
<div class="folder danger">666.sys</div>
</div>
</div>

<!-- INFO WINDOW -->
<div class="window hidden" id="infoWin">
<div class="titlebar">
<div class="title">System Info</div>
<div class="controls"><div class="btn close" id="closeInfo"></div></div>
</div>
<div class="content">
<p>invalid entity found: exarin | at 0x0FF419RE18</p>
</div>
</div>

<!-- SOCIALS WINDOW -->
<div class="window hidden" id="socialWin">
<div class="titlebar">
<div class="title">Socials</div>
<div class="controls"><div class="btn close" id="closeSocial"></div></div>
</div>
<div class="content">
<p>Discord: fogmail.cc</p>
</div>
</div>

</div>

<!-- TASKBAR -->
<div class="taskbar">
<div class="start">Start</div>
<div class="clock" id="clock">03:33 AM</div>
</div>

<script>
const music = document.getElementById("bgmusic");
const corruptMusic = document.getElementById("corruptMusic");
const errorSound = document.getElementById("errorSound");

const sys666 = document.getElementById("sys666");
const clock = document.getElementById("clock");

const info = document.getElementById("info");
const socials = document.getElementById("socials");

const infoWin = document.getElementById("infoWin");
const socialWin = document.getElementById("socialWin");

let corrupted = false;

window.addEventListener("click", () => {
music.play();
}, { once:true });

function xpPopup(text){

const box = document.createElement("div");
box.className = "xpbox";

box.style.left = Math.random()*window.innerWidth + "px";
box.style.top = Math.random()*window.innerHeight + "px";

box.innerHTML = `
<div class="xp-title">
<span>System Error</span>
<button onclick="this.parentElement.parentElement.remove()">X</button>
</div>
<div class="xp-body">
<img src="https://win98icons.alexmeub.com/icons/png/msg_warning-0.png">
<p>${text}</p>
</div>
`;

document.body.appendChild(box);

setTimeout(() => box.remove(), 6000);
}

function loopErrors(){

if(!corrupted) return;

xpPopup([
"I AM WATCHING",
"STOP BREATHING",
"YOU SHOULDN'T HAVE OPENED ME",
"I SEE YOU",
"DO YOU HAVE GUTS??",
"I SEE YOU",
"NO ESCAPE",
"I AM WATCHING",
"STOP BREATHING",
"YOU SHOULDN'T HAVE OPENED ME",
"I SEE YOU",
"DO YOU HAVE GUTS??",
"I SEE YOU",
"NO ESCAPE"
][Math.floor(Math.random()*14)]);

errorSound.currentTime = 0;
errorSound.play();

setTimeout(loopErrors, 400 + Math.random()*1200);
}

function trigger666(){

if(corrupted) return;
corrupted = true;

music.pause();
corruptMusic.play();

clock.innerText = "06:66 AM";

for(let i=0;i<12;i++){
setTimeout(() => {
errorSound.currentTime = 0;
errorSound.play();
}, i*200);
}

loopErrors();
}

sys666.onclick = trigger666;

info.onclick = () => infoWin.classList.remove("hidden");
socials.onclick = () => socialWin.classList.remove("hidden");

document.getElementById("closeInfo").onclick = () => infoWin.classList.add("hidden");
document.getElementById("closeSocial").onclick = () => socialWin.classList.add("hidden");

</script>

</body>
</html>
