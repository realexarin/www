<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Computer</title>

<link rel="icon" href="https://win98icons.alexmeub.com/icons/png/computer_explorer-0.png">
<link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="bgmusic" loop>
<source src="assets/song.mp3">
</audio>

<audio id="corruptMusic" loop>
<source src="assets/song2.mp3">
</audio>

<audio id="errorSound">
<source src="https://files.catbox.moe/j6n0m5.mp3">
</audio>

<div class="scanlines"></div>
<div class="noise"></div>
<div class="vignette"></div>

<div class="desktop">

<!-- ICONS -->
<div class="icon" id="mycomputer" style="top:40px;left:30px;">
<img src="https://win98icons.alexmeub.com/icons/png/computer_explorer-0.png">
<span>My Computer</span>
</div>

<div class="icon" id="recycle" style="top:130px;left:30px;">
<img src="https://win98icons.alexmeub.com/icons/png/recycle_bin_empty-0.png">
<span>Recycle Bin</span>
</div>

<div class="icon danger" id="sys666" style="top:220px;left:30px;">
<img src="https://win98icons.alexmeub.com/icons/png/msg_error-0.png">
<span>666.sys</span>
</div>

<div class="icon" id="info" style="top:310px;left:30px;">
<img src="https://win98icons.alexmeub.com/icons/png/msg_information-0.png">
<span></span>
</div>

<!-- WINDOW -->
<div class="window hidden" id="window">

<div class="titlebar">
<div class="title">My Computer</div>
<div class="controls">
<div class="btn">_</div>
<div class="btn">□</div>
<div class="btn close" id="close"></div>
</div>
</div>

<div class="content">
<div class="folder">Documents</div>
<div class="folder">Disk (C:)</div>
<div class="folder">Internet</div>
<div class="folder danger">666.sys</div>
</div>

</div>

<!-- CREDITS -->
<div class="window hidden" id="credits">

<div class="titlebar">
<div class="title">Information</div>
<div class="controls">
<div class="btn">_</div>
<div class="btn">□</div>
<div class="btn close" id="closeCredits"></div>
</div>
</div>

<div class="content">
<p>System build: UNKNOWN</p>
<p>Origin: corrupted sector</p>
<p>Status: unstable</p>
</div>

</div>

</div>

<!-- TASKBAR -->
<div class="taskbar">
<div class="start">Start</div>
<div class="clock" id="clock">03:33 AM</div>
</div>

<script>
const music = document.getElementById("bgmusic");
const corruptMusic = document.getElementById("corruptMusic");
const errorSound = document.getElementById("errorSound");

const win = document.getElementById("window");
const credits = document.getElementById("credits");

const close = document.getElementById("close");
const closeCredits = document.getElementById("closeCredits");

const info = document.getElementById("info");

const sys666 = document.getElementById("sys666");
const clock = document.getElementById("clock");

let corrupted = false;
let loopStarted = false;

window.addEventListener("click", () => {
music.play();
}, { once:true });

document.getElementById("mycomputer").onclick = () => {
win.classList.remove("hidden");
};

close.onclick = () => win.classList.add("hidden");

info.onclick = () => {
credits.classList.remove("hidden");
};

closeCredits.onclick = () => {
credits.classList.add("hidden");
};

function xpPopup(text){

const box = document.createElement("div");
box.className = "xpbox";

box.innerHTML = `
<div class="xp-title">
<span>System Message</span>
<button class="xp-x">X</button>
</div>
<div class="xp-body">
<img src="https://win98icons.alexmeub.com/icons/png/msg_warning-0.png">
<p>${text}</p>
</div>
`;

document.body.appendChild(box);

box.querySelector(".xp-x").onclick = () => box.remove();

setTimeout(() => box.remove(), 6000);
}

function corruptionLoop(){

if(!corrupted) return;

setTimeout(() => {

xpPopup([
"HE IS WATCHING",
"PROCESS FAILED",
"YOU SHOULDN'T HAVE OPENED IT",
"666 ACTIVE",
"SYSTEM BREACH",
"NO ESCAPE"
][Math.floor(Math.random()*6)]);

errorSound.currentTime = 0;
errorSound.play();

corruptionLoop();

}, 400 + Math.random()*1200);
}

function trigger(){

if(corrupted) return;
corrupted = true;

music.pause();
corruptMusic.play();

clock.innerText = "06:66 AM";

for(let i=0;i<12;i++){
setTimeout(() => {
errorSound.currentTime = 0;
errorSound.play();
}, i*200);
}

corruptionLoop();
}

sys666.onclick = trigger;

</script>

</body>
</html>
